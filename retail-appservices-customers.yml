server:
  port: 8081

spring:
  application:
    name: retail-appservices-customers

  datasource:
    url: jdbc:postgresql://localhost:5432/retail_customers_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    instance-id: CUSTOMERS
    prefer-ip-address: true
    

management:
  endpoints:
    web:
      exposure:
        include: "*"
